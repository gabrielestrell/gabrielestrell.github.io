<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorial 3: Grid Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-layout">
  <header class="site-header">
    <nav class="header-nav">
      <!-- Style this flexible nav component -->
      <span class="logo">Site Name</span>
      <ul class="nav-links">
        <li><a href="#">Link</a></li>
        <li><a href="#">Link</a></li>
        <li><a href="#">Link</a></li>
      </ul>
    </nav>
  </header>
  <main class="hero-section">
    <h1>Hero Headline</h1>
    <p>Supporting text for the hero section goes here.</p>
  </main>
  
  <section class="list-section">
    <!-- Add your repeating component in here -->

    <div class="wrapper">
      <!--
      <div>
        <div>
          
        </div>
      </div>
      -->
      <img src="pomeranian-dog.jpg" alt="Picture of a pomeranian dog." style="width: 100px;height: 100px;">
      <h1>Dog</h1>
      <p>One of the most popular pet are dogs.</p>
    </div>
    
    <div class="wrapper">
      <img src="tabby-cat.jpg" alt="Picture of a tabby cat." style="width: 100px;height: 100px;">
      <h1>Cat</h1>
      <p>Another very popular pet are cats.</p>
    </div>

    <div class="wrapper">
      <img src="goldfish.jpg" alt="Picture of a goldfish." style="width: 100px;height: 100px;">
      <h1>Goldfish</h1>
      <p>The third most popular pet are goldfish.</p>
    </div>

  </section>
  
  <footer class="site-footer">
    <p>Footer content</p>
  </footer>
</body>
</html>
